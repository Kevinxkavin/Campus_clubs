# ── Server ─────────────────────────────────────────────────────────────────
server.port=8081
spring.application.name=campusclubs-backend

# ── MySQL (SQL – users, roles, audit) ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/campusclubs_sql?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=KR76181@zz
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── MongoDB (NoSQL – clubs, events, posts, notifications) ──────────────────
spring.data.mongodb.uri=mongodb://localhost:27017/campusclubs_nosql

# ── JWT ────────────────────────────────────────────────────────────────────
# 256-bit secret (change in production!)
app.jwt.secret=CampusClubs2025SecretKeyForJWTSigningMustBe256BitsLong!Secure
app.jwt.expiration-ms=86400000
# 24 h access token
app.jwt.refresh-expiration-ms=604800000
# 7-day refresh token

# ── CORS ───────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ── Springdoc / Swagger ────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ────────────────────────────────────────────────────────────────
logging.level.com.campusclubs=DEBUG
logging.level.org.springframework.security=WARN

# ── Email (SMTP – for verification emails) ─────────────────────────────────
