# App base URL (used to build verification links)
app.base-url=http://localhost:3000

# Email verification token expiry (minutes)
app.email.verify-expiry-minutes=60

# ── Rate Limiting (Bucket4j / in-memory) ────────────────────────────────────
# Max 10 requests per 10 seconds per IP for auth endpoints
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-seconds=10
# Max 30 requests per 10 seconds for general API
app.rate-limit.api.capacity=30
app.rate-limit.api.refill-seconds=10
